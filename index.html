<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>诗诗专属小熊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{width:100vw;height:100vh;background:linear-gradient(145deg,#ffd6e3,#ffe8f0);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;padding:16px}
.text-top{text-align:center;margin-bottom:20px}
.title{font-size:2rem;color:#994477;font-weight:700;letter-spacing:1px;text-shadow:0 2px 6px rgba(255,200,220,.7)}
.sub{font-size:1.4rem;color:#b86899;margin-top:6px}
.bear-wrap{width:260px;height:280px;cursor:pointer;transition:transform .1s ease;filter:drop-shadow(0 12px 18px rgba(180,126,88,.25));-webkit-tap-highlight-color:transparent}
.bear-wrap:active{transform:scaleY(.7) scaleX(1.18)}
.bear{width:100%;height:100%;background:#b47e58;border-radius:50% 50% 46% 46%;position:relative;transition:all .2s cubic-bezier(.17,.67,.3,1.33);box-shadow:inset 0 -8px 10px rgba(0,0,0,.05)}
.bear:active{border-radius:55% 55% 62% 62%}
.ear1,.ear2{width:86px;height:86px;background:#b47e58;border-radius:50%;position:absolute;top:-14px;box-shadow:0 4px 8px rgba(120,70,40,.1)}
.ear1{left:-12px}.ear2{right:-12px}
.ear-in{width:52px;height:52px;background:#f8ddc7;border-radius:50%;position:absolute;top:17px;left:17px}
.face{width:170px;height:140px;background:#f8ddc7;border-radius:50%;position:absolute;top:52px;left:50%;transform:translateX(-50%);box-shadow:inset 0 6px 12px rgba(200,150,120,.15)}
.eye1,.eye2{width:16px;height:20px;background:#2e1e14;border-radius:50%;position:absolute;top:36px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.eye1{left:42px}.eye2{right:42px}
.eye1::after,.eye2::after{content:'';position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;top:3px;left:3px;opacity:.85}
.blush1,.blush2{width:36px;height:22px;background:#f5b4bc;border-radius:50%;position:absolute;top:72px;opacity:.7;filter:blur(.6px)}
.blush1{left:24px}.blush2{right:24px}
.nose{width:24px;height:18px;background:#3b2a1e;border-radius:50%;position:absolute;top:62px;left:50%;transform:translateX(-50%);box-shadow:0 2px 3px rgba(0,0,0,.15)}
.mouth{width:32px;height:16px;border-bottom:3px solid #3b2a1e;border-radius:0 0 20px 20px;position:absolute;top:84px;left:50%;transform:translateX(-50%)}
.belly{width:130px;height:140px;background:#f8ddc7;border-radius:50%;position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);box-shadow:inset 0 6px 12px rgba(200,150,120,.15)}
.foot1,.foot2{width:70px;height:42px;background:#b47e58;border-radius:50%;position:absolute;bottom:-24px;box-shadow:0 6px 10px rgba(100,60,30,.15)}
.foot1{left:32px}.foot2{right:32px}
.love-note{margin-top:24px;padding:14px 28px;background:rgba(255,245,250,.8);backdrop-filter:blur(6px);border-radius:60px;box-shadow:0 8px 20px rgba(190,120,150,.2);border:1px solid rgba(255,220,235,.9);max-width:90%;text-align:center}
.love-note p{font-size:1.2rem;color:#994477;font-weight:500;line-height:1.5;letter-spacing:.3px}
.love-note p span{background:linear-gradient(145deg,#b45f8a,#d48eb0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.tip-text{margin-top:16px;color:#b86899;font-size:.95rem;letter-spacing:.5px;opacity:.8}
</style>
</head>
<body>
<div class="text-top">
<div class="title">🐻 诗诗专属小玩具</div>
<div class="sub">(っ˘ω˘ς ) 捏捏我呀～</div>
</div>
<div class="bear-wrap" id="bear">
<div class="bear">
<div class="ear1"><div class="ear-in"></div></div>
<div class="ear2"><div class="ear-in"></div></div>
<div class="face">
<div class="eye1"></div><div class="eye2"></div>
<div class="blush1"></div><div class="blush2"></div>
<div class="nose"></div><div class="mouth"></div>
</div>
<div class="belly"></div>
<div class="foot1"></div><div class="foot2"></div>
</div>
</div>
<div class="love-note">
<p>请诗诗继续成为我生命中<span>不可或缺</span>的存在吧</p>
</div>
<div class="tip-text">👆 长按 / 点击小熊 · 捏一捏</div>
<script>
(function(){
let audioCtx=null;
function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}if(audioCtx.state==='suspended')audioCtx.resume()}
function playSquish(){if(!audioCtx)return;const now=audioCtx.currentTime;const dur=.18;const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=audioCtx.createBufferSource();n.buffer=buf;const f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=680;f.Q.value=1.2;const g=audioCtx.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.5,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+dur);n.connect(f);f.connect(g);g.connect(audioCtx.destination);n.start(now);n.stop(now+dur)}
function playPop(){if(!audioCtx)return;const now=audioCtx.currentTime;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(620,now);o.frequency.exponentialRampToValueAtTime(180,now+.09);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.3,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.1);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.12)}
const bear=document.getElementById('bear');
function down(e){e.preventDefault();initAudio();playSquish()}
function up(e){e.preventDefault();if(audioCtx)playPop()}
bear.addEventListener('mousedown',down);
bear.addEventListener('mouseup',up);
bear.addEventListener('touchstart',down,{passive:false});
bear.addEventListener('touchend',up);
bear.addEventListener('touchcancel',up);
bear.addEventListener('contextmenu',e=>e.preventDefault());
document.body.addEventListener('click',function a(){initAudio();document.body.removeEventListener('click',a)},{once:true});
})();
</script>
</body>
</html>
